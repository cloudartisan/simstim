name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out all history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned secret scanner
        run: python3 tools/security-install-gitleaks.py
      - name: Scan all repository history and working-tree files
        run: tools/security-scan.sh all

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.13.5
      - name: Install pinned host-test dependencies
        run: python -m pip install --disable-pip-version-check -r ble-fallback/requirements-host.txt
      - name: Run wireless-control tests
        run: python -m unittest discover -s wireless-control/tests -v
      - name: Run attention-lab tests
        run: python -m unittest discover -s attention-lab -p 'test_*.py' -v
      - name: Run standalone host tests
        run: python -m unittest discover -s k151-standalone/host -v
      - name: Run BLE fallback tests
        run: python -m unittest discover -s ble-fallback/tests -v
      - name: Run upstream checker tests
        run: python -m unittest discover -s tests -v
      - name: Run firmware host tests with sanitizers
        run: bash ble-fallback/tests/run_firmware_tests.sh
