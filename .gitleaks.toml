[extend]
useDefault = true

# Catch common project-local credential assignments in addition to Gitleaks' rules.
[[rules]]
id = "simstim-generic-secret-assignment"
description = "Credential-like assignment with a high-entropy value"
regex = '''(?i)(?:api[_-]?key|secret|token|password)\s*[:=]\s*["'][A-Za-z0-9_./+=-]{16,}["']'''
secretGroup = 0
keywords = ["api_key", "apikey", "secret", "token", "password"]

[[allowlists]]
description = "One fixed, explicitly fictional credential used by the existing unit test"
regexTarget = "line"
regexes = ['FICTIONAL_PASSWORD\s*=\s*"fictional-pass-42"']
